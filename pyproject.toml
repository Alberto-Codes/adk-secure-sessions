[project]
name = "adk-secure-sessions"
version = "1.3.0"
description = "Encrypted session persistence for Google ADK agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Alberto-Codes", email = "alberto.codes.dev@gmail.com" }
]
maintainers = [
    { name = "Alberto-Codes", email = "alberto.codes.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.22.0",
    "cryptography>=44.0.0",
    # sqlalchemy is imported directly; google-adk 2.x moved it behind its optional
    # `db` extra, so it must be declared here rather than inherited. aiosqlite is
    # the driver for the default `sqlite+aiosqlite://` URL and is declared for
    # the same reason: our import path should not depend on upstream's extras.
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.21",
]
keywords = [
    "adk",
    "agents",
    "ai",
    "compliance",
    "encrypted sessions",
    "encryption",
    "google adk security",
    "hipaa",
    "security",
    "session encryption",
    "sessions",
    "sqlite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
postgres = []  # Phase 3: PostgreSQL persistence backend

[project.urls]
Homepage = "https://github.com/Alberto-Codes/adk-secure-sessions"
Documentation = "https://alberto-codes.github.io/adk-secure-sessions/"
Repository = "https://github.com/Alberto-Codes/adk-secure-sessions"
Issues = "https://github.com/Alberto-Codes/adk-secure-sessions/issues"
Changelog = "https://github.com/Alberto-Codes/adk-secure-sessions/releases"

[build-system]
requires = ["uv_build>=0.11.20,<0.13.0"]
build-backend = "uv_build"

# TestPyPI publishing index (for `uv publish --index testpypi`)
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".uv-cache", ".venv", "__pycache__", "*.egg-info", "specs", "_bmad", "_bmad-output"]

[tool.ruff.lint]
extend-select = [
    "E402",  # ruff 0.16.0 dropped it from the default set — keep it on
    "E501",
    "I",
    "D",
]
ignore = [
    "RUF022",  # __all__ is plain-alphabetical, enforced by tests/unit/test_public_api.py
]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "S102",  # test_docs_examples executes the extracted getting-started snippet
    "DTZ",  # naive datetimes are the point: SQLite hands back tz-less values
]
"scripts/spike_*.py" = [
    "BLE001",  # throwaway spikes print-and-continue on any failure by design
    "DTZ006",
]

[tool.ruff.lint.isort]
known-first-party = ["adk_secure_sessions"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.docvet]
fail-on = ["enrichment", "freshness", "coverage", "griffe", "presence"]

[tool.docvet.presence]
min-coverage = 100.0

[tool.uv-secure.vulnerability_criteria]
ignore_vulnerabilities = []
allow_unused_ignores = false

# --------------------------------------------------------------------------- #
# import-linter
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_package = "adk_secure_sessions"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "adk_secure_sessions.services",
    "adk_secure_sessions.rotation",
    "adk_secure_sessions.backends",
    "adk_secure_sessions.serialization",
    "adk_secure_sessions.protocols | adk_secure_sessions.exceptions",
]

[[tool.importlinter.contracts]]
name = "Backends are independent of each other"
type = "independence"
modules = [
    "adk_secure_sessions.backends.fernet",
    "adk_secure_sessions.backends.aes_gcm",
]

[[tool.importlinter.contracts]]
name = "Rotation is standalone (no backends or services)"
type = "forbidden"
source_modules = ["adk_secure_sessions.rotation"]
forbidden_modules = [
    "adk_secure_sessions.backends",
    "adk_secure_sessions.services",
]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests - fast, isolated",
    "integration: Integration tests with real databases",
    "slow: Slow-running tests",
    "benchmark: Performance benchmark tests",
]
addopts = "-m 'not benchmark'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # aiosqlite.Connection.close() does not join _connection_worker_thread — the
    # thread may call call_soon_threadsafe() after pytest-asyncio closes the event
    # loop, raising RuntimeError("Event loop is closed"). This is an inherent race
    # in aiosqlite's architecture (no thread.join() in close()), not a test defect.
    "ignore:Exception in thread.*_connection_worker_thread.*:pytest.PytestUnhandledThreadExceptionWarning",
    # google-adk RunConfig accesses a deprecated pydantic field
    # (save_input_blobs_as_artifacts) internally — upstream issue, not our defect.
    # google-adk RunConfig.save_input_blobs_as_artifacts deprecated pydantic field;
    # narrowed to google.adk.runners to surface deprecations from other ADK submodules.
    "ignore:deprecated:DeprecationWarning:google\\.adk\\.runners",
    # google-adk >= 2.x emits a DeprecationWarning at import time when its own
    # LlmAgentConfig subclasses the deprecated BaseAgentConfig. Upstream
    # module-level code, not our defect.
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16",
    "ty>=0.0.64",
    "griffe>=2.0",
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-material>=9.7.1",
    "mkdocstrings>=1.0.2",
    "mkdocstrings-python>=2.0.1",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-section-index>=0.3.10",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-macros-plugin>=1.5.0",
    "pillow>=12.1.0",
    "cairosvg>=2.8.2",
    "griffe-warnings-deprecated>=1.1.0",
    "griffe-inherited-docstrings>=1.1.2",
    "docvet>=1.15",
    "pip-audit>=2.9.0",
    "uv-secure>=0.17.0",
    "import-linter>=2.11",
    "litellm>=1.82.0",
    # Runs from the lockfile in both pre-commit and CI. A pinned pre-commit
    # mirror is a second version to keep equal by hand.
    "yamllint>=1.38",
]
